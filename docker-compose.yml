services:
  wso2apim:
    image: wso2/wso2am:4.7.0
    restart: unless-stopped
    ports:
      # HTTPS API Manager
      - "9443:9443"

      # API Gateway
      - "8243:8243"

      # API Gateway HTTP
      - "8280:8280"
    volumes:
      - ./conf/deployment.toml:/home/wso2carbon/wso2am-4.7.0/repository/conf/deployment.toml
      - ./conf/log4j2.properties:/home/wso2carbon/wso2am-4.7.0/repository/conf/log4j2.properties
      - ./logs:/home/wso2carbon/wso2am-4.7.0/repository/logs
      - ./lib/org.wso2.apim.monetization.openmeter-1.0.0.jar:/home/wso2carbon/wso2am-4.7.0/repository/components/lib/org.wso2.apim.monetization.openmeter-1.0.0.jar
      - ./lib/postgresql-42.7.13.jar:/home/wso2carbon/wso2am-4.7.0/repository/components/lib/postgresql-42.7.13.jar
      - ./webapps/api#am#openmeter.war:/home/wso2carbon/wso2am-4.7.0/repository/deployment/server/webapps/api#am#openmeter.war
    networks:
      - quickstart_default
      - postgresql_default
  opensearch:
    image: opensearchproject/opensearch:2.19.4
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=false
      - DISABLE_SECURITY_PLUGIN=false
      # Demo security credentials
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - quickstart_default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -k -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.4
    container_name: opensearch-dashboards
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - DISABLE_INSTALL_DEMO_CONFIG=false
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    networks:
      - quickstart_default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:5601/api/status || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: fluent-bit
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./fluent-bit-conf/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit-conf/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - fluentbit_state:/fluent-bit/state
      - ./logs:/fluent-bit/logs
    ports:
      - "2020:2020"
      - "24224:24224"
      - "24224:24224/udp"
    command:
      - /fluent-bit/bin/fluent-bit
      - -c
      - /fluent-bit/etc/fluent-bit.conf
    networks:
      - quickstart_default

volumes:
  fluentbit_state:

networks:
  postgresql_default:
    external: true
  quickstart_default:
    external: true
