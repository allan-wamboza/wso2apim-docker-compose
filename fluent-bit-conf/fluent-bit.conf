[SERVICE]
    Flush               1
    Daemon              Off
    Log_Level           info
    Parsers_File        /fluent-bit/etc/parsers.conf

[INPUT]
    Name                tail
    Tag                 wso2_apim_logs
    Path                /fluent-bit/logs/*.log
    Refresh_Interval    5
    Buffer_Chunk_Size   32KB
    Buffer_Max_Size     2MB
    Mem_Buf_Limit       256MB
    Read_from_Head      true
    DB                  /fluent-bit/state/metrics-tail-status.db

[FILTER]
    name                  multiline
    match                 wso2_apim_logs
    multiline.key_content log
    multiline.parser      wso2_multiline_parser

[FILTER]
    Name                  modify
    Match                 wso2_apim_logs
    Add product           api-management
    Add component         apim

[FILTER]
    Name          rewrite_tag
    Match         wso2_apim_logs
    Rule          $log ^CARBON wso2_apim_carbon_logs false
    Emitter_Name  re_emitted_apim_carbon

[FILTER]
    Name          parser
    Match         wso2_apim_carbon_logs
    Key_Name      log
    Parser        wso2apim_carbon_parser
    Reserve_Data  True
    Preserve_Key  True

[FILTER]
    Name          rewrite_tag
    Match         wso2_apim_logs
    Rule          $log ^HTTP wso2_apim_http_logs false
    Emitter_Name  re_emitted_apim_http

[FILTER]
    Name          rewrite_tag
    Match         wso2_apim_logs
    Rule          $log ^AUDIT wso2_apim_audit_logs false
    Emitter_Name  re_emitted_apim_audit

[FILTER]
    Name          rewrite_tag
    Match         wso2_apim_logs
    Rule          $log ^CREL wso2_apim_correlation_logs false
    Emitter_Name  re_emitted_apim_correlation

[FILTER]
    Name          rewrite_tag
    Match         wso2_apim_logs
    Rule          $log ^TRACE wso2_apim_trace_logs false
    Emitter_Name  re_emitted_apim_trace

[OUTPUT]
    Name                opensearch
    Match               wso2_apim_carbon_logs
    Host                opensearch
    Port                9200
    HTTP_User           admin
    HTTP_Passwd         password123
    Logstash_Format     On
    Logstash_DateFormat %Y-%m-%d
    Logstash_Prefix     wso2-apim-application-logs
    Replace_Dots        On
    Suppress_Type_Name  On
    tls                 On
    tls.verify          Off
    Trace_Error         On

[OUTPUT]
    Name                opensearch
    Match               wso2_apim_http_logs
    Host                opensearch
    Port                9200
    HTTP_User           admin
    HTTP_Passwd         password123
    Logstash_Format     On
    Logstash_DateFormat %Y-%m-%d
    Logstash_Prefix     wso2-apim-access-logs
    Replace_Dots        On
    Suppress_Type_Name  On
    tls                 On
    tls.verify          Off
    Trace_Error         On

[OUTPUT]
    Name                opensearch
    Match               wso2_apim_correlation_logs
    Host                opensearch
    Port                9200
    HTTP_User           admin
    HTTP_Passwd         password123
    Logstash_Format     On
    Logstash_DateFormat %Y-%m-%d
    Logstash_Prefix     wso2-apim-correlation-logs
    Replace_Dots        On
    Suppress_Type_Name  On
    tls                 On
    tls.verify          Off
    Trace_Error         On

[OUTPUT]
    Name                opensearch
    Match               wso2_apim_trace_logs
    Host                opensearch
    Port                9200
    HTTP_User           admin
    HTTP_Passwd         password123
    Logstash_Format     On
    Logstash_DateFormat %Y-%m-%d
    Logstash_Prefix     wso2-apim-trace-logs
    Replace_Dots        On
    Suppress_Type_Name  On
    tls                 On
    tls.verify          Off
    Trace_Error         On

[OUTPUT]
    Name                opensearch
    Match               wso2_apim_audit_logs
    Host                opensearch
    Port                9200
    HTTP_User           admin
    HTTP_Passwd         password123
    Logstash_Format     On
    Logstash_DateFormat %Y-%m-%d
    Logstash_Prefix     wso2-apim-audit-logs
    Replace_Dots        On
    Suppress_Type_Name  On
    tls                 On
    tls.verify          Off
    Trace_Error         On