[OUTPUT]
    Name                opensearch
    Match               metrics.response
    Host                opensearch
    Port                9200
    HTTP_User           admin
    HTTP_Passwd         Password@1238938998
    Logstash_Format     On
    Logstash_DateFormat %Y-%m-%d
    Logstash_Prefix     wso2-apim-event-response
    Replace_Dots        On
    Suppress_Type_Name  On
    tls                 On
    tls.verify          Off
    Trace_Error         On

[OUTPUT]
    Name                opensearch
    Match               metrics.faulty
    Host                opensearch
    Port                9200
    HTTP_User           admin
    HTTP_Passwd         Password@1238938998
    Logstash_Format     On
    Logstash_DateFormat %Y-%m-%d
    Logstash_Prefix     wso2-apim-event-faulty
    Replace_Dots        On
    Suppress_Type_Name  On
    tls                 On
    tls.verify          Off
    Trace_Error         On

