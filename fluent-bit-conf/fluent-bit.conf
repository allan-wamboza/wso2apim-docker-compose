[SERVICE]
    Flush               1
    Daemon              Off
    Log_Level           info
    Parsers_File        /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               apim.metrics
    Path              /wso2-logs/external-gateway/logs/apim_metrics.log,/wso2-logs/internal-gateway/logs/apim_metrics.log
    DB                /var/fluent-bit/state/apim-metrics.db
    Refresh_Interval  10
    Rotate_Wait       30
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Read_from_Head    On

# Split the APIM line into the event type (apimMetrics) and its JSON payload
[FILTER]
    Name      parser
    Match     apim.metrics
    Key_Name  log
    Parser    apim_metrics_parser
    Reserve_Data  On

# Route by event type so each lands in its own index
[FILTER]
    Name      rewrite_tag
    Match     apim.metrics
    Rule      $apimMetrics ^apim:response$ metrics.response false
    Emitter_Name  re_emitted_response

[FILTER]
    Name      rewrite_tag
    Match     apim.metrics
    Rule      $apimMetrics ^apim:faulty$ metrics.faulty false
    Emitter_Name  re_emitted_faulty

# Lift the JSON payload into real fields so OpenSearch can index them
[FILTER]
    Name      parser
    Match     metrics.*
    Key_Name  properties
    Parser    json_payload
    Reserve_Data  On

